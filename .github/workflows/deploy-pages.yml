name: Deploy to GitHub Pages

# Builds the Vite app and publishes ./dist to GitHub Pages.
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (With the default "Deploy from a branch" the raw source tree is served and the app 404s
# on /src/main.tsx. The configure-pages step below switches a fresh repo to the workflow
# source automatically, but an existing branch-based setup has to be switched by hand.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # keep dist/.nojekyll (v4+ strips dotfiles by default)
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
